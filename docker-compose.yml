services:
  mysql:
    image: mysql:8.4
    container_name: enterprise-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: enterprise_demo
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - enterprise-agent-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  enterprise-agent-mysql-data:
